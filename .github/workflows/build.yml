name: Build & test Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt requests

      - name: Unit tests
        run: python -m pytest -q

      - name: Build LailaPayroll program (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name LailaPayroll `
            --icon static\img\lg-logo.ico `
            --add-data "templates;templates" --add-data "static;static" `
            --collect-submodules uvicorn --collect-submodules sqlalchemy.dialects.sqlite `
            --hidden-import python_multipart --hidden-import multipart --hidden-import pyodbc `
            --collect-data tzdata --collect-submodules reportlab --collect-submodules cryptography `
            run.py
          Get-ChildItem dist\LailaPayroll | Select-Object -First 10

      - name: Build installer (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\LailaPayroll.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item installer\Output\LailaPayroll_Setup.exe | Format-List Name, Length

      - name: Install silently (like double-click on the server)
        run: |
          $p = Start-Process installer\Output\LailaPayroll_Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install-log.txt' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installer failed" }

      - name: End-to-end test of the installed program
        run: python tests/e2e_installed.py http://127.0.0.1:8585

      - name: Re-install must wipe everything (fresh setup again)
        run: |
          $p = Start-Process installer\Output\LailaPayroll_Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=reinstall-log.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "re-install failed" }
          for ($i = 0; $i -lt 90; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:8585/ -UseBasicParsing -TimeoutSec 5; break } catch { Start-Sleep 1 } }
          if ($r.Content -notmatch 'first-time setup') { throw "after re-install the setup page should show again" }
          "fresh setup page shown again - OK"

      - name: Uninstall works
        run: |
          $u = Get-ChildItem "C:\Program Files\LailaPayroll\unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep 5
          if (Get-ScheduledTask -TaskName LailaPayroll -ErrorAction SilentlyContinue) { throw "task still registered" }
          if (Get-Process LailaPayroll -ErrorAction SilentlyContinue) { throw "program still running" }
          "uninstall OK"

      - name: Collect diagnostics
        if: always()
        run: |
          $out = "ci-log.txt"
          "=== run $env:GITHUB_RUN_NUMBER  commit $env:GITHUB_SHA  $(Get-Date)" | Out-File $out
          foreach ($f in @('install-log.txt','reinstall-log.txt')) { if (Test-Path $f) { "`n=== $f (last 60)" | Add-Content $out; Get-Content $f -Tail 60 | Add-Content $out } }
          Get-ChildItem "$env:ProgramData\LailaPayroll\logs" -ErrorAction SilentlyContinue | ForEach-Object { "`n=== $($_.Name)" | Add-Content $out; Get-Content $_.FullName -Tail 120 | Add-Content $out }
          "`n=== scheduled task" | Add-Content $out; (schtasks /query /tn LailaPayroll /v /fo list 2>&1) | Add-Content $out
          "`n=== port 8585" | Add-Content $out; (netstat -ano | Select-String ':8585') | Add-Content $out
          "`n=== program folder" | Add-Content $out; (Get-ChildItem "C:\Program Files\LailaPayroll" -ErrorAction SilentlyContinue | Select-Object -First 15 | Out-String) | Add-Content $out

      - name: Publish diagnostics (for the developer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-log -y --cleanup-tag 2>$null
          gh release create ci-log ci-log.txt --title "CI log run $env:GITHUB_RUN_NUMBER (${{ job.status }})" --notes "Diagnostics of the last build" --prerelease
        continue-on-error: true

      - name: Publish LailaPayroll_Setup.exe
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag 2>$null
          gh release create latest installer\Output\LailaPayroll_Setup.exe `
            --title "LAILA GROUP Attendance & Payroll - installer (build $env:GITHUB_RUN_NUMBER)" `
            --notes "Tested on Windows: install, first-time setup, machines, employees, attendance, payroll, payslips, mobile punch, re-install, uninstall. Download LailaPayroll_Setup.exe below and double-click it on the head-office server. Developed by: SPHere - 01617144755"
